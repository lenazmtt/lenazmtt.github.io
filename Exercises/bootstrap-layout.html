<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Layout</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-MKn5NWVBEuQXJE7TSKSgPUmMiSCmVTfCsR+VSSeQpHnoyJQZZFn/kBn+Ht5jZDPQ" crossorigin="anonymous">
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col border border-primary">
                <h1>Bootstrap Layout</h1>
            </div>
        </div>

        <div class="row">
            <div class="col-2 border border-primary">
                <p>Sidebar</p>
            </div>
            <div class="col-10 border border-primary">
                <div class="container p-3">
                    <div class="row g-0">
                        <div class="col-3 border border-primary">
                            <p>col-1</p>
                        </div>
                        <div class="col-9 border border-primary">
                            <p>col-2</p>
                        </div>
                    </div>
                    <div class="row g-0">
                        <div class="col-6 border border-primary">
                            <p>col-1</p>
                        </div>
                        <div class="col-6 border border-primary">
                            <p>col-2</p>
                        </div>
                    </div>
                    <div class="row g-0">
                        <div class="col-2 border border-primary">
                            <p>col-1</p>
                        </div>
                        <div class="col-8 border border-primary">
                            <p>col-2</p>
                        </div>
                        <div class="col-2 border border-primary">
                            <p>col-3</p>
                        </div>
                    </div>
                    <div class="row g-0">
                        <div class="col-1 border border-primary">
                            <p>col-1</p>
                        </div>
                        <div class="col-4 border border-primary">
                            <p>col-2</p>
                        </div>
                        <div class="col-6 border border-primary">
                            <p>col-3</p>
                        </div>
                        <div class="col-1 border border-primary">
                            <p>col-4</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col border border-primary">
                <h1>Footer</h1>
            </div>
        </div>
    </div>
</body>
</html>
